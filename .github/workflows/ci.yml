name: CI

on:
    push:
        branches:
            - master
            - develop
    pull_request:
        branches:
            - master
            - develop

jobs:
    ci:
        name: Lint, Types & Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Diagnostic: environment
              run: |
                echo "=== node & pnpm versions ==="
                node -v || true
                pnpm -v || true
                echo "=== workspace files ==="
                ls -la
                echo "=== show .npmrc ==="
                if [ -f .npmrc ]; then sed -n '1,120p' .npmrc; else echo '.npmrc missing'; fi
                echo "=== show .pnpmfile.cjs ==="
                if [ -f .pnpmfile.cjs ]; then sed -n '1,200p' .pnpmfile.cjs; else echo '.pnpmfile.cjs missing'; fi
                echo "=== show pnpm-lock.yaml header ==="
                sed -n '1,60p' pnpm-lock.yaml || true

            - name: Install dependencies
              run: |
                  # Try to non-interactively approve any ignored build prompts (send 'a' to select all)
                  printf 'a\n' | pnpm approve-builds || true
                  # Prefer a frozen install for reproducibility; fall back to non-frozen if it still fails.
                  pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

            - name: Type check
              run: pnpm tsc --noEmit

            - name: Lint
              run: pnpm lint

            - name: Tests
              run: pnpm test
