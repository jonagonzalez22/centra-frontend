name: CI

on:
    push:
        branches:
            - master
            - develop
    pull_request:
        branches:
            - master
            - develop

jobs:
    ci:
        name: Lint, Types & Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: |
                  # Prefer a frozen install for reproducibility. If that fails due to ignored builds
                  # (pnpm prompts for approve-builds) fall back to a non-frozen install to allow CI to proceed.
                  pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

            - name: Type check
              run: pnpm tsc --noEmit

            - name: Lint
              run: pnpm lint

            - name: Tests
              run: pnpm test
