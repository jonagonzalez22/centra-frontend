version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centra-frontend
    ports:
      - '5173:5173'
    volumes:
      - ./:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
